<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Third Voice</title>
<style>
:root { --bg: #f7f6f3; --panel: #fff; --ink: #1d1c1a; --muted: #6b665f; --line: #e3dfd8; --accent: #3a6ea5; --speak: #2e7d4f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141312; --panel: #1d1c1a; --ink: #f3efe9; --muted: #a39d95; --line: #34312d; --accent: #8db4e2; --speak: #7fc79a; } }
:root[data-theme="dark"] { --bg: #141312; --panel: #1d1c1a; --ink: #f3efe9; --muted: #a39d95; --line: #34312d; --accent: #8db4e2; --speak: #7fc79a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 24px; }
header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 750; font-size: 20px; } .brand span { color: var(--accent); }
.sub { color: var(--muted); font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input, textarea { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
textarea { min-height: 150px; resize: vertical; }
button { font: inherit; border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer; background: var(--ink); color: var(--bg); font-weight: 650; margin-top: 14px; width: 100%; }
button:disabled { opacity: .5; cursor: default; }
#status { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
#log { list-style: none; padding: 0; margin: 0; max-height: 72vh; overflow: auto; }
#log li { padding: 10px 0; border-bottom: 1px solid var(--line); }
#log .txt { font-size: 17px; }
#log .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chip { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 99px; padding: 1px 8px; margin-right: 6px; border: 1px solid var(--line); color: var(--muted); }
.chip.speak { color: var(--speak); border-color: var(--speak); }
#log li.ai { border-left: 3px solid var(--speak); padding-left: 12px; }
#log li.ai .txt { font-weight: 600; }
.empty { color: var(--muted); }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">Third <span>Voice</span></span>
    <span class="sub">An AI teammate on one shared mic. It speaks only when it should. Higgs Realtime + STT + TTS 3.</span>
  </header>
  <section class="panel">
    <label for="ai">The AI's name</label><input id="ai" value="Higgs">
    <label for="setting">Setting</label><input id="setting" value="hackathon team meeting">
    <label for="people">People in the room (comma-separated)</label><input id="people" value="Ana, Ben, Chen">
    <label for="facts">What the AI knows (one fact per line)</label>
    <textarea id="facts">The demo video must be 2 to 3 minutes and show the project running.
Judges review the public GitHub repo at a pinned commit plus the video; a live URL is optional.
Judging: Use of Higgs Audio 30%, User Experience 25%, Innovation 25%, Technical Execution 20%.
Submissions close Saturday at 3 pm.</textarea>
    <button id="start">Start listening</button>
    <div id="status">Talk among yourselves. Address the AI by name, or ask the group something it knows.</div>
  </section>
  <section class="panel">
    <ul id="log"><li class="empty">The conversation appears here, each line with the AI's decision.</li></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
